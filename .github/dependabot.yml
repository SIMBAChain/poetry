version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker-base-images:
        patterns: ["*"]
    ignore:
      # Each directory pins a specific Python line (3.11, 3.12, ...);
      # only patch bumps within that line should be automatic.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
